[package]
name = "opensesame"
version = "0.1.1"
description = "Hold a key and open anything: apps, folders and window layouts"
authors = ["ta-nish18"]
license = "MIT"
repository = "https://github.com/kobito-tools/OpenSesame"
edition = "2021"

[lib]
name = "opensesame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
file_icon_provider = "1.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# ポップアップを透過ウィンドウのままにすると、backdrop-filterはデスクトップを
# ぼかせず背景と同化する。NSVisualEffectViewで実際にぼかす。
window-vibrancy = "0.6"

# macOSでは自前のCGEventTapを使う。rdevはキー押下のたびにメインスレッド必須の
# Text Services Managerを呼ぶため、バックグラウンドのフックでは必ずクラッシュする。
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging"
] }
