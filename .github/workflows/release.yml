# v から始まるタグ（例: v0.1.0）を push すると、macOS / Windows 用の
# インストーラーをビルドし、GitHub Releases に下書きとして登録する。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon / Intel の両方で動くユニバーサル版を作る。
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSesame! ${{ github.ref_name }}"
          releaseBody: |
            インストール方法は README を参照してください。
            - macOS: `OpenSesame!_x.y.z_universal.dmg`
            - Windows: `OpenSesame!_x.y.z_x64-setup.exe`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
